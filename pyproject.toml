[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "witness"
dynamic = ["version"]
description = "A DFIR agent that can only report what it can prove a tool said."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
witness = "witness.cli:main"

[tool.hatch.version]
path = "src/witness/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/witness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
